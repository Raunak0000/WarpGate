name: Release WarpGate Binary

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: warpgate
            asset_name: warpgate-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: warpgate
            asset_name: warpgate-linux-arm64
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: warpgate
            asset_name: warpgate-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: warpgate
            asset_name: warpgate-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: warpgate.exe
            asset_name: warpgate-windows-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if required)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} --bin warpgate --manifest-path rust/Cargo.toml
          else
            cargo build --release --locked --target ${{ matrix.target }} --bin warpgate --manifest-path rust/Cargo.toml
          fi

      - name: Package release archive
        shell: bash
        run: |
          BIN_PATH="rust/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          STAGE="staging"
          mkdir -p "$STAGE"
          cp "$BIN_PATH" "$STAGE/"
          [ -f README.md ] && cp README.md "$STAGE/"
          [ -f LICENSE ] && cp LICENSE "$STAGE/"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "${{ matrix.asset_name }}.zip" "./$STAGE/*"
            echo "ARCHIVE=${{ matrix.asset_name }}.zip" >> $GITHUB_ENV
          else
            tar -czvf "${{ matrix.asset_name }}.tar.gz" -C "$STAGE" .
            echo "ARCHIVE=${{ matrix.asset_name }}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ env.ARCHIVE }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate Checksums
        run: |
          cd release-artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} . \;
          sha256sum warpgate-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
