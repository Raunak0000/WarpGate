plugin: amazon.aws.aws_ec2

regions:
  - us-east-1
  - us-east-2
  - us-west-1
  - us-west-2
  - eu-central-1
  - eu-west-1
  - eu-west-2
  - ap-northeast-1
  - ap-southeast-1
  - ap-south-1

filters:
  tag:Role: vpn
  instance-state-name: running

hostnames:
  - ip-address

compose:
  ansible_host: public_ip_address

keyed_groups:
  - key: tags.Role
    prefix: role
