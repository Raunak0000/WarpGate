- name: Install Wireguard
  apt:
    name: wireguard
    state: present
    update_cache: yes

- name: Enable IPv4 forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes

- name: Deploy Wireguard configuration
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  notify: Restart Wireguard

- name: Enable and start Wireguard service
  systemd:
    name: wg-quick@wg0
    enabled: yes
    state: started