[package]
name = "warpgate-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
warpgate-common = { path = "../warpgate-common" }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
qrcode = "0.14.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
