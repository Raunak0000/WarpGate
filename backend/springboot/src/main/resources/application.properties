spring.application.name=warpgate-control-plane

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/warpgate}
spring.datasource.username=${DB_USERNAME:warpgate}
spring.datasource.password=${DB_PASSWORD:warpgate_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

warpgate.orchestrator.base-url=http://localhost:3000

